name: Déploiement GitHub Pages

on:
  # Se déclenche à la fin du workflow CI plutôt que sur push directement :
  # garantit qu'on ne déploie jamais un commit sur lequel lint/typecheck/
  # tests/build ont échoué, y compris en cas de push direct sur main qui
  # contournerait une éventuelle protection de branche basée sur les PR.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # write (et non read) : le tag de déploiement pour rollback ci-dessous doit pouvoir pousser
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Le SHA exact qui a passé la CI, pas juste « la HEAD actuelle de
          # main » qui a pu bouger entre-temps si des pushes s'enchaînent.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Non secrète (juste l'adresse du worker, protégée par le code de
          # synchro) : réglable dans Settings → Secrets and variables →
          # Actions → Variables. Absente = fonctionnalité masquée dans l'app
          # déployée (voir worker/README.md).
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Vérification post-déploiement
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Vérification de $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          if [ "$code" != "200" ]; then
            echo "::error::Le site déployé répond avec le code $code au lieu de 200."
            exit 1
          fi
          echo "OK ($code)."

      # Checkout tardif, juste pour le tag ci-dessous : `deploy-pages`
      # n'a besoin d'aucun fichier du dépôt, seulement de l'artefact déjà
      # uploadé par le job `build`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Tag de déploiement (pour repérer/rollback une version)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="pages-deploy-${{ github.run_number }}"
          git tag -a "$tag" -m "Déploiement GitHub Pages (run ${{ github.run_id }})"
          git push origin "$tag"
