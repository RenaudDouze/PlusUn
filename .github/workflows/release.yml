name: Release

# VER-02 : à chaque push sur main (donc sur un commit dont les checks requis sont verts),
# semantic-release lit les Conventional Commits depuis le dernier tag (GIT-07). feat/fix/perf/
# build(deps) ou un changement cassant donne un tag vX.Y.Z et une release GitHub aux notes
# générées. Aucun commit n'est poussé sur main (VER-05).
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@25 -p @semantic-release/exec@7 semantic-release
