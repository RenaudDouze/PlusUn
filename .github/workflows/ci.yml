name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Tests unitaires + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Tests fonctionnels (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation-testing-plan:
    name: Mutation testing — plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Un job par module, d'après les cibles de stryker.config.mjs.
      - id: plan
        run: node .github/scripts/mutation-matrix.mjs

  mutation-testing-module:
    name: Mutation testing — ${{ matrix.name }}
    needs: mutation-testing-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-testing-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Seuil bloquant à 100 % : un seul mutant survivant fait échouer le job.
      - run: npx stryker run
        env:
          MUTATE: ${{ matrix.mutate }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: reports/mutation/
          retention-days: 14

  # Un seul check stable « Mutation testing (logique pure) » pour la protection
  # de branche, quel que soit le nombre de modules.
  mutation-testing:
    name: Mutation testing (logique pure)
    needs: mutation-testing-module
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tous les modules à 100 %
        env:
          RESULT: ${{ needs.mutation-testing-module.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Mutation testing : au moins un module sous 100 % ($RESULT)."
            exit 1
          fi

  worker-tests:
    name: Worker de synchronisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run lint
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npm run test:coverage
        working-directory: worker
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-coverage-report
          path: worker/coverage/
          retention-days: 14
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker
      - name: Audit complet (production + développement)
        run: npm audit --audit-level=high
        working-directory: worker

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production à « high » (et non « moderate » comme les autres dépôts) :
      # la chaîne vite-plugin-pwa → workbox-build → minimatch remonte des
      # avis moderate sans correctif sans montée majeure. À repasser en
      # « moderate » dès que vite-plugin-pwa 1.x les corrige.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complet (production + développement)
        run: npm audit --audit-level=high

  build:
    name: Build de production
    needs: [lint, typecheck, unit-tests, e2e-tests, mutation-testing, worker-tests, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
      # Pas un vrai déploiement de preview (ça demanderait un hébergeur tiers
      # + un nouveau secret, une décision à prendre séparément) : juste de
      # quoi télécharger et ouvrir le build en local pour relire une PR sans
      # attendre le merge sur main.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-build-preview
          path: dist/
          retention-days: 7
