name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Contrôle complet la nuit : la mutation de tous les modules, que les PR ne refont pas (MUT-10).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Tests unitaires + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Tests fonctionnels (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation-testing-plan:
    name: Mutation testing — plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Un job par module, d'après les cibles de stryker.config.mjs.
      - id: plan
        run: node .github/scripts/mutation-matrix.mjs
      # PR : seulement les modules touchés ; nuit : tous ; push sur main : aucun (MUT-10).
      - id: select
        run: node .github/scripts/mutation-select.mjs
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}

  mutation-testing-module:
    name: Mutation testing — ${{ matrix.name }}
    needs: mutation-testing-plan
    if: needs.mutation-testing-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-testing-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Seuil bloquant à 100 % : un seul mutant survivant fait échouer le job.
      - run: npx stryker run
        env:
          MUTATE: ${{ matrix.mutate }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report-${{ matrix.name }}
          path: reports/mutation/
          retention-days: 14

  # Un seul check stable « Mutation testing (logique pure) » pour la protection
  # de branche, quel que soit le nombre de modules.
  mutation-testing:
    name: Mutation testing (logique pure)
    needs: [mutation-testing-plan, mutation-testing-module]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tous les modules à 100 %
        env:
          PLAN: ${{ needs.mutation-testing-plan.result }}
          RESULT: ${{ needs.mutation-testing-module.result }}
        run: |
          # « skipped » : aucun module concerné par la PR (ou push sur main).
          if [ "$PLAN" != "success" ] || { [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; }; then
            echo "::error::Mutation testing : au moins un module sous 100 % ($RESULT)."
            exit 1
          fi

  worker-tests:
    name: Worker de synchronisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run lint
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npm run test:coverage
        working-directory: worker
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-coverage-report
          path: worker/coverage/
          retention-days: 14
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker
      - name: Audit complet (production + développement)
        run: node ../.github/scripts/audit-check.mjs --level=high
        working-directory: worker

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production à « high » (et non « moderate » comme les autres dépôts) :
      # la chaîne vite-plugin-pwa → workbox-build → minimatch remonte des
      # avis moderate sans correctif sans montée majeure. À repasser en
      # « moderate » dès que vite-plugin-pwa 1.x les corrige.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complet (production + développement)
        run: node .github/scripts/audit-check.mjs --level=high

  build:
    name: Build de production
    needs: [lint, typecheck, unit-tests, e2e-tests, mutation-testing, worker-tests, audit]
    # Sans cette condition, `success()` implicite exige aussi que les modules de mutation (ancêtres,
    # « skipped » quand aucun n'est concerné) aient réussi : le build serait sauté (MUT-10).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
      # Pas un vrai déploiement de preview (ça demanderait un hébergeur tiers
      # + un nouveau secret, une décision à prendre séparément) : juste de
      # quoi télécharger et ouvrir le build en local pour relire une PR sans
      # attendre le merge sur main.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-build-preview
          path: dist/
          retention-days: 7
