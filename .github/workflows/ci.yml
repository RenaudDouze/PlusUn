name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Vérification des types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Tests unitaires + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Tests fonctionnels (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation-tests-shard:
    name: Mutation testing (logique pure) — lot ${{ matrix.shard }}
    strategy:
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: files
        run: node .github/scripts/mutation-shard-files.mjs
        env:
          SHARD: ${{ matrix.shard }}
      - run: npx stryker run --mutate "${{ steps.files.outputs.files }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: reports/mutation/
          retention-days: 14

  # Agrège les 2 lots sous un seul check nommé « Mutation testing (logique
  # pure) », comme avant la parallélisation : c'est ce nom exact que
  # référencent les required status checks du dépôt (voir README.md), et un
  # renommage aurait cassé la protection de branche sans qu'aucun réglage
  # GitHub ne l'indique dans ce repo.
  mutation-tests:
    name: Mutation testing (logique pure)
    needs: mutation-tests-shard
    runs-on: ubuntu-latest
    steps:
      - run: echo "Les 2 lots de mutation testing sont passés."

  worker-tests:
    name: Worker de synchronisation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run lint
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npm run test:coverage
        working-directory: worker
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage-report
          path: worker/coverage/
          retention-days: 14
      # Niveau « high » ici (contrairement au « critical » utilisé pour le
      # front, voir le job `audit` plus bas) : le worker n'a aucune
      # dépendance de build lourde de type vite-plugin-pwa/workbox, donc rien
      # n'empêche de viser un niveau plus strict dès maintenant.
      - run: npm audit --audit-level=high
        working-directory: worker

  audit:
    name: Audit des dépendances (front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Niveau « critical » et non « high » : une vulnérabilité high existe
      # actuellement dans la chaîne vite-plugin-pwa → workbox-build → ajv →
      # fast-uri (GHSA-5jgf-p345-68v8 et consorts), uniquement utilisée au
      # moment du build pour générer le manifest PWA — jamais exécutée dans
      # le bundle livré au navigateur. Aucun correctif amont disponible pour
      # l'instant ; bloquer la CI dessus casserait le pipeline sans qu'on
      # puisse agir. Dependabot (.github/dependabot.yml) remontera la mise à
      # jour dès qu'elle existera. À repasser en « high » à ce moment-là.
      - run: npm audit --audit-level=critical

  build:
    name: Build de production
    needs: [lint, typecheck, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_WORKER_URL: ${{ vars.VITE_SYNC_WORKER_URL }}
      # Pas un vrai déploiement de preview (ça demanderait un hébergeur tiers
      # + un nouveau secret, une décision à prendre séparément) : juste de
      # quoi télécharger et ouvrir le build en local pour relire une PR sans
      # attendre le merge sur main.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-preview
          path: dist/
          retention-days: 7
