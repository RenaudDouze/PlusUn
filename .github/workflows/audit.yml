name: Audit planifié

# Une vulnérabilité publiée après le dernier merge ne bloque aucune PR avant la
# suivante : cet audit hebdomadaire la fait remonter sans attendre. Mêmes niveaux
# que le job « Audit des dépendances » de ci.yml.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit planifié
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Production (.)
        run: npm audit --omit=dev --audit-level=high
      - name: Production + développement (.)
        run: npm audit --audit-level=high
      - name: Production (worker)
        run: npm audit --omit=dev --audit-level=high
        working-directory: worker
      - name: Production + développement (worker)
        run: npm audit --audit-level=high
        working-directory: worker
